<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in · AssignKit</title>
<link rel="stylesheet" href="shared/css/styles.css" />
</head>
<body>
  <div class="login-shell">
    <div class="card login-card">
      <h1 id="formTitle">Student Sign In</h1>
      <p style="color:var(--ink-soft); margin-top:-8px; margin-bottom:20px; font-size:.9rem;">
        Sign in to continue.
      </p>

      <div id="errorBanner"></div>

      <form id="loginForm">
        <div class="field">
          <label id="idLabel">Register Number</label>
          <input id="identifier" type="text" autocomplete="username" required />
        </div>
        <div class="field">
          <label>Password</label>
          <input id="password" type="password" autocomplete="current-password" required />
        </div>
        <button class="btn" type="submit" style="width:100%; justify-content:center;" id="submitBtn">
          Sign in
        </button>
      </form>

      <p style="text-align:center; margin-top:18px; font-size:.88rem;">
        <a href="#" id="toggleRoleLink">Sign in as Lecturer instead</a>
      </p>
      <p style="text-align:center; margin-top:6px; font-size:.78rem;">
        <a href="admin/login.html" style="color:var(--ink-soft);">Administrator sign in</a>
      </p>
    </div>
  </div>

  <script src="shared/js/api.js"></script>
  <script>
    let selectedRole = "student";
    const idLabels = { student: "Register Number", lecturer: "Lecturer ID" };
    const titles = { student: "Student Sign In", lecturer: "Lecturer Sign In" };
    const toggleLabels = { student: "Sign in as Lecturer instead", lecturer: "Sign in as Student instead" };
    const destinations = { student: "student/index.html", lecturer: "lecturer/index.html" };

    if (Auth.isLoggedIn()) {
      const dest = Auth.role() === "admin" ? "admin/index.html" : (destinations[Auth.role()] || "student/index.html");
      window.location.href = dest;
    }

    document.getElementById("toggleRoleLink").addEventListener("click", (e) => {
      e.preventDefault();
      selectedRole = selectedRole === "student" ? "lecturer" : "student";
      document.getElementById("formTitle").textContent = titles[selectedRole];
      document.getElementById("idLabel").textContent = idLabels[selectedRole];
      document.getElementById("toggleRoleLink").textContent = toggleLabels[selectedRole];
      document.getElementById("identifier").value = "";
      document.getElementById("password").value = "";
      document.getElementById("errorBanner").innerHTML = "";
    });

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorBanner = document.getElementById("errorBanner");
      const submitBtn = document.getElementById("submitBtn");
      errorBanner.innerHTML = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "Signing in…";

      try {
        const session = await Api.post("/auth/login", {
          identifier: document.getElementById("identifier").value.trim(),
          password: document.getElementById("password").value,
          role: selectedRole,
        });
        Auth.save(session);
        window.location.href = destinations[selectedRole];
      } catch (err) {
        errorBanner.innerHTML = `<div class="error-banner">${err.message || "Invalid credentials."}</div>`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign in";
      }
    });
  </script>
</body>
</html>
